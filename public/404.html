<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Página não encontrada · Lista de mercado</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <!-- Estilo embutido: o GitHub Pages serve esta página em qualquer caminho
       errado, e aí um estilo.css relativo poderia não ser achado. -->
  <style>
    :root { color-scheme: light dark; --fundo: #f7f6f2; --tinta: #121212; --verde: #1b7f3b; --cinza: #6b6b6b; }
    @media (prefers-color-scheme: dark) {
      :root { --fundo: #121212; --tinta: #f2f2f2; --verde: #5dd07f; --cinza: #a0a0a0; }
    }
    body {
      background: var(--fundo); color: var(--tinta); margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-content: center; text-align: center; padding: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--cinza); margin: 0 0 24px; }
    a {
      display: inline-block; padding: 12px 20px; border-radius: 10px;
      background: var(--verde); color: var(--fundo); font-weight: 600; text-decoration: none;
    }
    a:focus-visible { outline: 2px solid var(--verde); outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>Lista de mercado</h1>
  <p>Essa página não existe.</p>
  <a id="ir-pra-lista" href="./">Ir pra lista</a>
  <!-- Única página com script embutido: o Pages serve este arquivo no caminho
       que a pessoa digitou (/lista-de-mercado/a/b), e aí "./" e "icone.svg"
       apontariam pra dentro de /a/. Sem JS fica o "./", que acerta no caso
       comum (um nível só). -->
  <script>
    // No github.io o site vive em /<repositório>/; em domínio próprio, na raiz.
    function raizDoProjeto(hostname, pathname) {
      const primeiro = pathname.split("/").filter(Boolean)[0];
      return hostname.endsWith("github.io") && primeiro ? "/" + primeiro + "/" : "/";
    }
    const raiz = raizDoProjeto(location.hostname, location.pathname);
    document.getElementById("ir-pra-lista").href = raiz;
    document.querySelector('link[rel="icon"]').href = raiz + "icone.svg";
  </script>
</body>
</html>
