# Baixa os preços dos mercados e publica o site no GitHub Pages.
# Nenhum dado entra no git: os JSON vão só no artefato do Pages.
name: Atualizar preços e publicar

on:
  schedule:
    # 6h17, 12h17 e 18h17 de Brasília. Fora do minuto 0, que o GitHub atrasa.
    - cron: "17 9,15,21 * * *"
  # Ajuste de código vai ao ar sem rastrear: só republica os dados publicados.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rastrear:
        type: boolean
        default: true
        description: "Rastrear os mercados (desligado = só republicar)"

# Por job: o que roda o robô (e baixa dados de terceiros) só lê o repo; só
# quem publica escreve no Pages.
permissions:
  contents: read

# Um deploy de cada vez; o que está rodando termina (não cancela no meio).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # O log do robô e o "ontem 18h" do site dependem do horário de Brasília.
  TZ: America/Sao_Paulo

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    # Cada mercado tem prazo de 40 min; o resto é folga para baixar e empacotar.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sem dependência e em segundos: um erro de sintaxe num módulo não vai
      # ao ar (o teste de navegador precisa de Playwright e fica de fora).
      - name: Testes
        run: npm test

      - name: Descobrir a URL do site
        run: |
          dono="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          # Repo <dono>.github.io é publicado na raiz; os outros num subcaminho.
          if [[ "$repo" == *.github.io ]]; then
            url="https://$repo"
          else
            url="https://$dono.github.io/$repo"
          fi
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "Site: $url"

      - name: Baixar os preços
        run: |
          extra=""
          if [[ "${{ github.event_name }}" == "push" ]] ||
             [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.rastrear }}" == "false" ]]; then
            extra="--so-anterior"
          fi

          # Republicando, saber se o site já existe: 404 no resumo é a primeira
          # publicação; qualquer outro status quer dizer que há (ou deveria haver)
          # dados, e uma falha ao baixá-los não pode virar site vazio por cima.
          status_anterior=""
          if [[ -n "$extra" ]]; then
            status_anterior=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "$SITE_URL/dados/resumo.json" || true)
            echo "resumo publicado: HTTP $status_anterior"
          fi

          codigo=0
          node robo/catalogo.mjs --saida public/dados --anterior "$SITE_URL/dados" $extra || codigo=$?

          # Saída 1 só é aceita na primeira publicação (republicando e resumo 404):
          # sobe sem dados e o site avisa "ainda sem preços". Em qualquer outro
          # caso 1 é falha de verdade e o site anterior continua no ar.
          # 2 é erro de uso, sempre falha.
          if [[ $codigo -eq 1 && -n "$extra" && "$status_anterior" == "404" ]]; then
            echo "::warning::Nenhum dado publicado ainda; o site sobe sem preços."
            mkdir -p public/dados
            codigo=0
          fi
          exit $codigo

      # Só lê a configuração do Pages (ligado à mão em Settings > Pages).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
